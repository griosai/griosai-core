# Opt-in MLflow backup CronJob (NOT in kustomization.yaml).
#
# The bundled tracker keeps all durable state on the mlflow-tracking PVC:
#   - mlflow.db        SQLite backend store (experiments, runs, metrics, params)
#   - artifacts/       run artifacts under the default artifact root
#
# This manifest takes a consistent online backup of mlflow.db using the SQLite
# online backup API (safe while MLflow is writing), tars the artifact tree, and
# writes both to a separate mlflow-backups PVC with a timestamped name. It then
# prunes copies older than BACKUP_RETENTION_DAYS.
#
# Apply it explicitly after the base tracker is up:
#   kubectl apply -f deploy/kubernetes/mlflow/backup-cronjob.yaml
#
# To ship backups off-cluster instead of (or in addition to) the local PVC,
# replace the mlflow-backups PVC mount with an object-store sync step (e.g. an
# `aws s3 cp`/`rclone` image with credentials from a Secret) or mirror the
# mlflow-backups PVC to object storage out of band. See
# docs/ops/backup-restore.md.
#
# Notes:
# - ReadWriteOnce permits co-mounting on one node but does not select that node.
#   Required pod affinity below targets the tracker and excludes backup pods.
#   Before applying, ensure the backup PVC uses a compatible pre-bound volume
#   or a WaitForFirstConsumer storage class whose driver can provision beside
#   the tracker. Incompatible volume topology leaves the Job Pending; affinity
#   must not be relaxed to work around it. ReadWriteOncePod cannot co-mount:
#   use a snapshot or external database + object store instead.
# - The backup reuses the tracker image (python:3.12-slim base) and uses the
#   stdlib `sqlite3` module's online backup API via `python`. The standalone
#   `sqlite3` CLI is not guaranteed in slim images, but `python` and its
#   `sqlite3` module always are, so no extra image is pulled.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-backups
  namespace: griosai
  labels:
    app.kubernetes.io/name: mlflow-tracking
    app.kubernetes.io/part-of: griosai
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlflow-backup
  namespace: griosai
  labels:
    app.kubernetes.io/name: mlflow-tracking
    app.kubernetes.io/part-of: griosai
    app.kubernetes.io/component: backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mlflow-tracking
            app.kubernetes.io/part-of: griosai
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: mlflow-tracking
                      app.kubernetes.io/part-of: griosai
                    matchExpressions:
                      - key: app.kubernetes.io/component
                        operator: NotIn
                        values:
                          - backup
                  namespaces:
                    - griosai
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/gustavorios/griosai-mlflow:3.1.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
                  DEST="/backups/${STAMP}"
                  mkdir -p "${DEST}"
                  echo "Backing up mlflow.db to ${DEST}/mlflow.db ..."
                  # Use the sqlite3 stdlib online backup API. The source is
                  # opened read-write because MLflow runs the DB in WAL mode, and
                  # the backup API must touch the -wal/-shm sidecars to read a
                  # consistent snapshot (a read-only open fails on a WAL DB). This
                  # only reads committed state; it does not modify MLflow data,
                  # and is safe to run while the tracker keeps writing. That is
                  # why the /mlflow mount below is read-write, not read-only.
                  SRC_DB="/mlflow/mlflow.db" DEST_DB="${DEST}/mlflow.db" python -c 'import os, sqlite3; src = sqlite3.connect(os.environ["SRC_DB"]); out = sqlite3.connect(os.environ["DEST_DB"]); src.backup(out); out.close(); src.close()'
                  echo "Archiving artifacts to ${DEST}/artifacts.tar.gz ..."
                  if [ -d /mlflow/artifacts ]; then
                    tar -czf "${DEST}/artifacts.tar.gz" -C /mlflow artifacts
                  else
                    echo "No /mlflow/artifacts directory; skipping artifact tar."
                  fi
                  echo "Pruning backups older than ${BACKUP_RETENTION_DAYS} day(s) ..."
                  find /backups -mindepth 1 -maxdepth 1 -type d \
                    -mtime "+${BACKUP_RETENTION_DAYS}" -exec rm -rf {} +
                  echo "Backup complete: ${DEST}"
              env:
                - name: BACKUP_RETENTION_DAYS
                  value: "14"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                # Read-write: the SQLite online backup API needs to touch the
                # WAL/-shm sidecars on the source DB to read a consistent
                # snapshot. The backup only reads committed MLflow state.
                - name: mlflow-data
                  mountPath: /mlflow
                - name: mlflow-backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: mlflow-data
              persistentVolumeClaim:
                claimName: mlflow-tracking
            - name: mlflow-backups
              persistentVolumeClaim:
                claimName: mlflow-backups
            - name: tmp
              emptyDir: {}
