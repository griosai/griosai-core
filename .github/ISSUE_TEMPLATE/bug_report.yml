name: Bug report
description: Report a reproducible GriosAI problem without private data.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste credentials, vault contents, screenshots, raw logs, `.env` files, or full local paths.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Redacted commands and steps that reproduce the issue.
      placeholder: |
        1. Run `griosai ...`
        2. See `error: ...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, GriosAI commit/version, and optional adapters involved.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private vault contents, screenshots, raw logs, and full local paths.
          required: true
