apiVersion: apps/v1
kind: Deployment
metadata:
  name: griosai
  namespace: griosai
  labels:
    app.kubernetes.io/name: griosai
    app.kubernetes.io/part-of: griosai
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: griosai
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: griosai
        app.kubernetes.io/part-of: griosai
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: griosai
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: griosai
          image: ghcr.io/gustavorios/griosai:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --vault
            - /data/vault
            - --host
            - 0.0.0.0
            - --port
            - "8765"
            - --allow-host
            - localhost
            - --allow-host
            - griosai
            - --allow-host
            - griosai.griosai
            - --allow-host
            - griosai.griosai.svc
            - --allow-host
            - griosai.griosai.svc.cluster.local
          envFrom:
            - configMapRef:
                name: griosai-config
          env:
            - name: GRIOSAI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: griosai-api
                  key: GRIOSAI_API_TOKEN
                  optional: true
            - name: GRIOSAI_MLFLOW_TRACKING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: griosai-mlflow
                  key: GRIOSAI_MLFLOW_TRACKING_TOKEN
                  optional: true
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vault
              mountPath: /data/vault
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: griosai-vault
        - name: tmp
          emptyDir: {}
