name: Documentation gap
description: Report missing, stale, or unsafe documentation.
title: "docs: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Link or path to the affected document.
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Gap
      description: What is unclear, missing, stale, or unsafe?
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional wording or structure.
