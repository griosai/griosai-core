apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-tracking
  namespace: griosai
  labels:
    app.kubernetes.io/name: mlflow-tracking
    app.kubernetes.io/part-of: griosai
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-tracking
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-tracking
        app.kubernetes.io/part-of: griosai
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/gustavorios/griosai-mlflow:3.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-tracking
        - name: tmp
          emptyDir: {}
