apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: griosai-private
  namespace: griosai
  labels:
    app.kubernetes.io/name: griosai
    app.kubernetes.io/part-of: griosai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: griosai
      app.kubernetes.io/component: dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8765
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow-tracking
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
